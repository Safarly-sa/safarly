# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Any npm package version must have been published for at least 1 day (1440
# minutes) before pnpm will install it. Malicious npm releases are usually
# discovered and pulled within hours, so a 1-day delay is a strong buffer.
#
# DO NOT DISABLE THIS SETTING. If you urgently need a package inside the 1-day
# window (e.g. a security bugfix), add it to `minimumReleaseAgeExclude` below,
# and remove the exclusion once the window has passed.
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit bundles an older, vulnerable esbuild internally; this overrides it
  '@esbuild-kit/esm-loader': 'npm:tsx@^4.21.0'
  esbuild: '0.27.3'

# NOTE: Replit's config pinned this workspace to linux-x64 by overriding every
# other platform's optional binaries to "-" (esbuild, rollup, lightningcss,
# @tailwindcss/oxide, @expo/ngrok-bin). Those overrides were removed during the
# migration off Replit so pnpm resolves the correct native binaries for whatever
# platform you build on. Do not reintroduce them unless you are targeting a
# single fixed platform.
