<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" width="480" height="680">
  <rect width="480" height="680" fill="#F9F3E5"/>
  <!-- border frame -->
  <rect x="16" y="16" width="448" height="648" fill="none" stroke="#C8A96E" stroke-width="2"/>
  <rect x="22" y="22" width="436" height="636" fill="none" stroke="#C8A96E" stroke-width="0.5"/>
  <!-- header band -->
  <rect x="16" y="16" width="448" height="100" fill="#1A1208"/>
  <!-- restaurant name -->
  <text x="240" y="62" font-family="serif" font-size="28" fill="#C8A96E" text-anchor="middle" direction="rtl">مطعم النجد</text>
  <text x="240" y="92" font-family="serif" font-size="13" fill="#E8D5A8" text-anchor="middle" letter-spacing="3">AL-NAJD RESTAURANT · الرياض</text>
  <!-- divider -->
  <line x1="60" y1="134" x2="420" y2="134" stroke="#C8A96E" stroke-width="1"/>
  <text x="240" y="126" font-family="serif" font-size="11" fill="#9B7C3C" text-anchor="middle" direction="rtl" letter-spacing="2">قائمة الطعام</text>
  <!-- section label -->
  <text x="400" y="165" font-family="serif" font-size="12" fill="#9B7C3C" text-anchor="end" direction="rtl">— الأطباق الرئيسية —</text>
  <!-- dishes -->
  <text x="400" y="204" font-family="serif" font-size="22" fill="#1A1208" text-anchor="end" direction="rtl">كبسة دجاج</text>
  <text x="80" y="204" font-family="sans-serif" font-size="11" fill="#7A6040">Kabsa (Chicken)</text>
  <text x="400" y="222" font-family="sans-serif" font-size="11" fill="#9B7C3C" text-anchor="end" direction="rtl">أرز بالزعفران مع دجاج مطهو ببطء</text>
  <line x1="60" y1="232" x2="420" y2="232" stroke="#E0D0A8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="60" y="228" font-family="sans-serif" font-size="12" fill="#1A1208" font-weight="bold">35 SAR</text>

  <text x="400" y="268" font-family="serif" font-size="22" fill="#1A1208" text-anchor="end" direction="rtl">كبسة لحم</text>
  <text x="80" y="268" font-family="sans-serif" font-size="11" fill="#7A6040">Kabsa (Lamb)</text>
  <text x="400" y="286" font-family="sans-serif" font-size="11" fill="#9B7C3C" text-anchor="end" direction="rtl">خروف كامل مع أرز بهاري</text>
  <line x1="60" y1="296" x2="420" y2="296" stroke="#E0D0A8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="60" y="292" font-family="sans-serif" font-size="12" fill="#1A1208" font-weight="bold">55 SAR</text>

  <text x="400" y="332" font-family="serif" font-size="22" fill="#1A1208" text-anchor="end" direction="rtl">جريش</text>
  <text x="80" y="332" font-family="sans-serif" font-size="11" fill="#7A6040">Jareesh</text>
  <text x="400" y="350" font-family="sans-serif" font-size="11" fill="#9B7C3C" text-anchor="end" direction="rtl">قمح مطحون مع لحم وبصل محمر</text>
  <line x1="60" y1="360" x2="420" y2="360" stroke="#E0D0A8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="60" y="356" font-family="sans-serif" font-size="12" fill="#1A1208" font-weight="bold">28 SAR</text>

  <text x="400" y="396" font-family="serif" font-size="22" fill="#1A1208" text-anchor="end" direction="rtl">مندي لحم</text>
  <text x="80" y="396" font-family="sans-serif" font-size="11" fill="#7A6040">Mandi (Slow-Roasted Lamb)</text>
  <text x="400" y="414" font-family="sans-serif" font-size="11" fill="#9B7C3C" text-anchor="end" direction="rtl">خروف مدخن في التنور التقليدي</text>
  <line x1="60" y1="424" x2="420" y2="424" stroke="#E0D0A8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="60" y="420" font-family="sans-serif" font-size="12" fill="#1A1208" font-weight="bold">70 SAR</text>

  <text x="400" y="460" font-family="serif" font-size="22" fill="#1A1208" text-anchor="end" direction="rtl">مدفون</text>
  <text x="80" y="460" font-family="sans-serif" font-size="11" fill="#7A6040">Madfoon (Buried Lamb)</text>
  <text x="400" y="478" font-family="sans-serif" font-size="11" fill="#9B7C3C" text-anchor="end" direction="rtl">لحم خروف مدفون مع الفحم ليلة كاملة</text>
  <line x1="60" y1="488" x2="420" y2="488" stroke="#E0D0A8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="60" y="484" font-family="sans-serif" font-size="12" fill="#1A1208" font-weight="bold">75 SAR</text>

  <text x="400" y="524" font-family="serif" font-size="22" fill="#1A1208" text-anchor="end" direction="rtl">أوزي</text>
  <text x="80" y="524" font-family="sans-serif" font-size="11" fill="#7A6040">Ouzi (Whole Lamb with Rice)</text>
  <text x="400" y="542" font-family="sans-serif" font-size="11" fill="#9B7C3C" text-anchor="end" direction="rtl">خروف محشو فوق أرز بالزعفران</text>
  <line x1="60" y1="552" x2="420" y2="552" stroke="#E0D0A8" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="60" y="548" font-family="sans-serif" font-size="12" fill="#1A1208" font-weight="bold">85 SAR</text>

  <!-- footer -->
  <line x1="60" y1="598" x2="420" y2="598" stroke="#C8A96E" stroke-width="1"/>
  <text x="240" y="622" font-family="sans-serif" font-size="10" fill="#9B7C3C" text-anchor="middle">الرياض — المملكة العربية السعودية</text>
  <text x="240" y="642" font-family="sans-serif" font-size="9" fill="#C8B890" text-anchor="middle">demo menu · menu-riyadh.svg</text>
</svg>
