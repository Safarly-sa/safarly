kind = "web"
previewPath = "/"
title = "Safarly — Travel Companion"
version = "1.0.0"
id = "artifacts/safarly"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25035

[services.development]
run = "pnpm --filter @workspace/safarly run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/safarly", "run", "build" ]
serve = "static"
publicDir = "artifacts/safarly/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25035"
BASE_PATH = "/"
