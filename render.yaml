services:
  - type: web
    name: safarly-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: AGENTS_DEMO_MODE
        value: "true"
      - key: CORS_ORIGIN
        value: https://safarly.pages.dev
      # Render fronts the app with Cloudflare, which overwrites this header on
      # every request, so a client cannot forge it. Without it req.ip is the
      # proxy's address — the same for every caller — which erases the IP half
      # of the login throttle's key. See src/lib/client-ip.ts.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: DATABASE_URL
        sync: false
